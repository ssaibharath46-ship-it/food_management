<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Login | Second Serving</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <a class="brand" href="index.html">🍱 Second <span>Serving</span></a>
      <h1>Welcome back 👋</h1>
      <p>Login to continue rescuing food.</p>
      <form id="loginForm">
        <label>Email</label
        ><input
          id="email"
          type="email"
          required
          placeholder="you@example.com"
        /><label>Password</label
        ><input
          id="password"
          type="password"
          required
          placeholder="••••••••"
        /><button class="btn full" type="submit">Login</button>
        <div id="error" class="error"></div>
      </form>
      <p class="auth-foot">
        New here? <a href="signup.html">Create an account</a>
      </p>
      <div class="demo-box">
        Admin login: <b>admin@secondserving.com</b> / <b>admin123</b><br /><small
          >The admin account is created automatically in Local Storage.</small
        >
      </div>
      <button
        type="button"
        class="btn secondary full"
        id="resetDemo"
        style="margin-top: 10px"
      >
        Reset Demo Data
      </button>
    </div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.getElementById("resetDemo").onclick = () => {
        if (
          confirm("Clear Second Serving demo data and recreate the admin account?")
        ) {
          localStorage.clear();
          ensureAdmin();
          location.reload();
        }
      };
    </script>
  </body>
</html>
