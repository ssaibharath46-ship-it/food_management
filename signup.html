<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Signup | FoodRescue</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <a class="brand" href="index.html">🍱 Food<span>Rescue</span></a>
      <h1>Create account</h1>
      <p>Join the food rescue community.</p>
      <form id="signupForm">
        <label>Full Name</label
        ><input id="name" required placeholder="Your name" /><label>Email</label
        ><input
          id="email"
          type="email"
          required
          placeholder="you@example.com"
        /><label>Password</label
        ><input
          id="password"
          type="password"
          minlength="6"
          required
          placeholder="At least 6 characters"
        /><label>Role</label
        ><select id="role">
          <option value="donor">Donor</option>
          <option value="recipient">Recipient / NGO</option>
          <option value="volunteer">Volunteer</option></select
        ><label>Area</label
        ><input id="area" required placeholder="e.g. Vijayawada" /><button
          class="btn full"
          type="submit"
        >
          Create Account
        </button>
        <div id="error" class="error"></div>
      </form>
      <p class="auth-foot">
        Already registered? <a href="login.html">Login</a>
      </p>
    </div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
