<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Donate Food | FoodRescue</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="app"><aside class="sidebar"><a class="brand" href="dashboard.html">🍱 Food<span>Rescue</span></a><nav><a href="dashboard.html">🏠 Dashboard</a><a class="active" href="donate.html">🍱 Donate Food</a><a href="available.html">🔎 Find Food</a><a href="history.html">📜 My History</a></nav><button class="logout" onclick="logout()">↪ Logout</button></aside>
<main class="main"><div class="topbar"><div><p class="muted">Share surplus</p><h1>Post Food Donation</h1></div></div>
<div class="form-card"><div class="info-banner">⏰ <b>24-hour safety rule:</b> Your listing will automatically expire after 24 hours or at your earlier expiry time.</div>
<form id="donationForm" class="form-grid"><div><label>Food Name</label><input id="foodName" required placeholder="Vegetable Biryani"></div><div><label>Category</label><select id="category"><option>Cooked Meals</option><option>Rice / Biryani</option><option>Bakery</option><option>Fruits</option><option>Vegetables</option><option>Dairy</option><option>Packaged Food</option><option>Other</option></select></div><div><label>Quantity (kg)</label><input id="quantity" type="number" min="0.1" step="0.1" required></div><div><label>Servings</label><input id="servings" type="number" min="1" required></div><div><label>Location / Area</label><input id="location" required placeholder="Vijayawada"></div><div><label>Food expires in (hours)</label><input id="expiryHours" type="number" min="0.1" max="24" step="0.1" value="24" required></div><div class="full-col"><label>Description</label><textarea id="description" rows="4" placeholder="Freshly prepared, packed properly..."></textarea></div><div class="full-col"><label>Food Safety Checklist</label><div class="checks"><label><input type="checkbox" required> Food is covered/packed</label><label><input type="checkbox" required> Food is suitable for consumption</label><label><input type="checkbox" required> Preparation/expiry time is accurate</label></div></div><div class="full-col"><button class="btn" type="submit">🚀 Publish Donation</button></div></form></div></main></div><script src="js/app.js"></script><script src="js/donate.js"></script></body></html>
